name: Daily GMB Rating & Review Tracker (All Outlets)

on:
  schedule:
    # Daily at 12:30 AM IST (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual run button in Actions tab

permissions:
  contents: write

jobs:
  track-and-mail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run All Outlets Scraper & Send Mail
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          GOOGLE_SHEET_WEBHOOK_URL: ${{ secrets.GOOGLE_SHEET_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and Push Updated Excel
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "*.xlsx" "discovered_links.json"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated GMB update: $(date +'%d-%m-%Y')" && git push)
